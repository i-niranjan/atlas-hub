  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <!-- lineage: a path of decisions that forks at a pivot; the abandoned branch fades -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 760 L512 560 C512 470 420 440 372 360 L372 300" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="44"/>
    <path d="M512 760 L512 560 C512 470 640 440 652 360 L652 270" stroke="#FFFFFF" stroke-width="44"/>
  </g>
  <circle cx="372" cy="290" r="40" fill="#FFFFFF" fill-opacity="0.32"/>
  <circle cx="512" cy="760" r="54" fill="#FFFFFF"/>
  <circle cx="512" cy="560" r="44" fill="#FFFFFF"/>
  <circle cx="652" cy="262" r="62" fill="#FFFFFF"/>
  <circle cx="652" cy="262" r="26" fill="#2B3FB8"/>
</svg>
