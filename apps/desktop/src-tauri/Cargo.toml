[package]
name = "atlas"
version = "0.1.0"
description = "Atlas: the decisions behind every project on this Mac"
edition = "2021"

[lib]
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
